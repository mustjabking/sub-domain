<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Avelia Game Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#fff;background:#0a0518}
body::before{content:'';position:fixed;width:400px;height:400px;border-radius:50%;background:#8b5cf6;filter:blur(90px);opacity:.4;top:-120px;left:-120px;pointer-events:none;animation:fl 22s ease-in-out infinite}
body::after{content:'';position:fixed;width:360px;height:360px;border-radius:50%;background:#ec4899;filter:blur(90px);opacity:.4;bottom:-120px;right:-120px;pointer-events:none;animation:fl 22s ease-in-out infinite -11s}
@keyframes fl{50%{transform:translate(40px,-40px) scale(1.15)}}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:10px;flex-shrink:0;background:rgba(10,5,24,.7);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
.brand{font-size:17px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,#ffe066,#ff8fb1,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-small{font-size:15px;font-weight:700;opacity:.9}
.icon-btn{width:42px;height:42px;border:0;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.08);color:#fff;font-size:16px;border:1px solid rgba(255,255,255,.1);transition:all .15s;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn:active{transform:scale(.94)}
.home-content{flex:1;overflow-y:auto;padding:24px 18px;max-width:600px;margin:0 auto;width:100%}
.welcome{text-align:center;margin-bottom:24px}
.welcome h1{font-size:28px;font-weight:900;letter-spacing:-.8px;margin-bottom:6px}
.welcome p{opacity:.55;font-size:13px}
.btn-primary{border:0;cursor:pointer;font-family:inherit;font-weight:800;color:#2a0f4a;padding:16px 24px;border-radius:14px;font-size:15px;background:linear-gradient(160deg,#ffe580,#ffb800 45%,#ff9500);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 -2px 0 rgba(0,0,0,.15) inset,0 5px 0 #b86a00,0 10px 24px rgba(255,149,0,.35);transition:transform .1s,box-shadow .1s}
.btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 -2px 0 rgba(0,0,0,.15) inset,0 0 0 #b86a00,0 4px 10px rgba(255,149,0,.3)}
.btn-primary.large{width:100%;padding:18px;font-size:16px;margin-bottom:24px}
.btn-secondary{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:13px 18px;border-radius:12px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);transition:background .15s}
.btn-secondary:hover{background:rgba(255,255,255,.16)}
.btn-secondary:active{transform:scale(.97)}
.games-list{display:flex;flex-direction:column;gap:10px}
.game-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.09);cursor:pointer;transition:all .2s}
.game-card:hover{background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.06))}
.game-card .thumb{width:52px;height:52px;border-radius:11px;flex-shrink:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(255,255,255,.1)}
.game-card .info{flex:1;min-width:0}
.game-card .name{font-weight:700;font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-card .meta{font-size:10px;opacity:.5;letter-spacing:.5px}
.game-card .actions{display:flex;gap:5px}
.game-card .mini-btn{width:32px;height:32px;border:0;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.1);color:#fff;font-size:13px}
.game-card .mini-btn:hover{background:rgba(255,255,255,.2)}
.game-card .mini-btn.danger:hover{background:rgba(255,60,60,.3)}
.empty-state{text-align:center;padding:40px 20px;opacity:.45;font-size:13px;line-height:1.6}
.app-footer{flex-shrink:0;padding:12px 18px;text-align:center;font-size:10px;opacity:.4;letter-spacing:.5px;display:flex;flex-direction:column;gap:2px}
.tabs{display:flex;gap:4px;padding:10px 14px;overflow-x:auto;flex-shrink:0;background:rgba(10,5,24,.6);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.05);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;padding:9px 14px;border-radius:10px;color:rgba(255,255,255,.55);background:transparent;white-space:nowrap;transition:all .15s}
.tab.active{background:rgba(255,255,255,.12);color:#fff}
.tab-content{flex:1;overflow-y:auto;padding:18px;max-width:700px;margin:0 auto;width:100%}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.55;margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;font-family:inherit;font-size:14px;outline:none;transition:all .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.25)}
.form-select{cursor:pointer}
.form-select option{background:#1a0f2e;color:#fff}
.form-hint{font-size:11px;opacity:.45;margin-top:6px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.file-upload{border:2px dashed rgba(255,255,255,.2);border-radius:13px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .15s}
.file-upload:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.03)}
.file-upload .icon{font-size:30px;margin-bottom:6px}
.file-upload .text{font-size:13px;opacity:.7}
.file-upload .subtext{font-size:10px;opacity:.4;margin-top:4px}
.file-input-hidden{display:none}
.preview-box{width:100%;height:130px;border-radius:13px;overflow:hidden;background:#1a0f2e;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:10px;position:relative;background-size:cover;background-position:center}
.preview-box video{width:100%;height:100%;object-fit:cover}
.blocks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:10px;margin-bottom:14px}
.block-card{position:relative;aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.block-card .block-visual{width:70%;height:70%;display:flex;align-items:center;justify-content:center;font-size:30px}
.block-card .block-visual .gem{width:100%;height:100%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 32%),radial-gradient(circle at 72% 78%,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 55%),radial-gradient(circle at 50% 50%,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);border-radius:50%;box-shadow:inset 0 -4px 7px rgba(0,0,0,.35)}
.block-card .block-visual img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.block-card .remove-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:5px;cursor:pointer;background:rgba(255,60,60,.85);color:#fff;font-size:11px}
.add-block-btn{aspect-ratio:1;border:2px dashed rgba(255,255,255,.2);border-radius:14px;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;font-size:10px;font-weight:700;gap:4px;transition:all .15s}
.add-block-btn:hover{border-color:rgba(255,255,255,.4);color:#fff}
.add-block-btn .plus{font-size:22px;line-height:1}
.stage-row{display:grid;grid-template-columns:36px 1fr 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);margin-bottom:6px}
.stage-row .num{font-weight:800;font-size:11px;opacity:.5;text-align:center}
.stage-row input{width:100%;padding:7px 9px;border-radius:7px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:12px;outline:none}
.stage-row input:focus{border-color:rgba(255,255,255,.25)}
.items-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.item-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1)}
.item-card .item-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:20px}
.item-card .item-info{flex:1;min-width:0}
.item-card .item-name{font-weight:700;font-size:13px;margin-bottom:2px}
.item-card .item-meta{font-size:10px;opacity:.5}
.item-card .remove-btn{width:30px;height:30px;border:0;border-radius:7px;cursor:pointer;background:rgba(255,60,60,.2);color:#ff9090;font-size:13px}
.item-card .remove-btn:hover{background:rgba(255,60,60,.4)}
.modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,2,12,.85);backdrop-filter:blur(14px)}
.modal-overlay.show{display:flex}
.modal-card{background:linear-gradient(160deg,#2a1650,#140a28);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:22px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal-card h2{font-size:18px;font-weight:800;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:rgba(20,10,40,.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);color:#fff;padding:11px 20px;border-radius:11px;font-size:12px;font-weight:600;z-index:300;transition:transform .3s cubic-bezier(.2,1.2,.4,1);box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
#previewFrame{width:100%;flex:1;border:0;background:#000}
@media(max-width:500px){.row{grid-template-columns:1fr}.welcome h1{font-size:24px}}
</style>
</head>
<body>

<div class="screen active" id="homeScreen">
  <header class="app-header">
    <div class="brand">✨ Avelia Game Builder</div>
    <button class="icon-btn" id="settingsBtn">⚙️</button>
  </header>
  <div class="home-content">
    <div class="welcome">
      <h1 id="welcomeName">Welcome!</h1>
      <p>Design your own match-3 game</p>
    </div>
    <button class="btn-primary large" id="newGameBtn">✨ Create New Game</button>
    <div class="games-list" id="gamesList"></div>
  </div>
  <footer class="app-footer">
    <span>This web is created by Avelia</span>
    <span>avelia.oneapp.dev</span>
  </footer>
</div>

<div class="screen" id="builderScreen">
  <header class="app-header">
    <button class="icon-btn" id="backBtn">←</button>
    <div class="brand-small" id="builderTitle">New Game</div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="previewBtn" title="Preview">▶</button>
      <button class="icon-btn" id="exportBtn" title="Export ZIP">⬇</button>
    </div>
  </header>
  <div class="tabs" id="builderTabs">
    <button class="tab active" data-tab="basic">Basic</button>
    <button class="tab" data-tab="background">Background</button>
    <button class="tab" data-tab="blocks">Blocks</button>
    <button class="tab" data-tab="stages">Stages</button>
    <button class="tab" data-tab="items">Items</button>
  </div>
  <div class="tab-content" id="tabContent"></div>
</div>

<div class="screen" id="previewScreen">
  <header class="app-header">
    <button class="icon-btn" id="closePreviewBtn">✕</button>
    <div class="brand-small">Preview</div>
    <div style="width:42px"></div>
  </header>
  <iframe id="previewFrame"></iframe>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal-card">
    <h2>⚙️ Settings</h2>
    <div class="form-group">
      <label class="form-label">Your Name</label>
      <input type="text" class="form-input" id="settingsName" placeholder="Enter your name" maxlength="30">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="closeSettings" style="flex:1">Close</button>
      <button class="btn-primary" id="saveSettings" style="flex:1">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
