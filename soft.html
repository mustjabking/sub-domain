<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYRA — AI Builder | Created by MUHAMMAD TAQI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060f;
  --glass:rgba(17,24,39,.55);
  --border:rgba(255,255,255,.09);
  --accent:#8b5cf6;
  --accent2:#06b6d4;
  --pink:#ec4899;
  --text:#f3f4f6;
  --muted:#9ca3af;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 72%);
  mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 72%);
}
.orbs{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.5;animation:float 20s ease-in-out infinite}
.orb-1{width:520px;height:520px;background:#7c3aed;top:-180px;left:-140px}
.orb-2{width:460px;height:460px;background:#06b6d4;bottom:-180px;right:-140px;animation-delay:-7s;opacity:.42}
.orb-3{width:380px;height:380px;background:#ec4899;top:42%;left:58%;opacity:.22;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(34px,-42px) scale(1.09)}}

/* ---------- shell ---------- */
.page{
  min-height:100vh;width:100%;max-width:1180px;margin:0 auto;
  padding:22px clamp(16px,4vw,40px) 34px;
  display:flex;flex-direction:column;
  animation:fadeUp .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  font-family:'Orbitron',sans-serif;font-size:1.32rem;font-weight:800;letter-spacing:3px;
  background:linear-gradient(95deg,#fff,#c4b5fd 60%,#67e8f9);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(139,92,246,.55));
}
.brand-sub{
  font-size:.6rem;letter-spacing:2.6px;color:var(--muted);
  border:1px solid var(--border);padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.03);
}
.made{font-size:.78rem;color:var(--muted);letter-spacing:.4px}
.made b{color:#e9d5ff;font-weight:600}

.foot{
  margin-top:auto;padding-top:26px;text-align:center;
  font-size:.72rem;color:#4b5563;letter-spacing:.6px;
}
.foot span{color:#6b7280}

/* ---------- hero ---------- */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:46px 0 30px}
.pill{
  font-size:.68rem;letter-spacing:2.6px;color:#c4b5fd;font-weight:600;
  border:1px solid rgba(139,92,246,.35);background:rgba(139,92,246,.1);
  padding:7px 16px;border-radius:999px;box-shadow:0 0 30px -10px rgba(139,92,246,.9);
}
.title{
  font-size:clamp(2rem,6.2vw,3.7rem);line-height:1.08;font-weight:700;
  letter-spacing:-.025em;max-width:16ch;
}
.title.small{font-size:clamp(1.5rem,4.2vw,2.3rem);max-width:none}
.grad{
  background:linear-gradient(100deg,#a78bfa,#22d3ee 52%,#f472b6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--muted);font-size:clamp(.9rem,2.2vw,1rem);line-height:1.65;max-width:52ch}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:.95rem;
  border-radius:14px;transition:transform .22s,box-shadow .22s,background .22s,opacity .22s;
  text-decoration:none;white-space:nowrap;
}
.btn-primary{
  background:linear-gradient(120deg,#8b5cf6,#6366f1 45%,#06b6d4);
  color:#fff;padding:16px 34px;
  box-shadow:0 14px 44px -12px rgba(139,92,246,.95);
  background-size:180% 180%;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 54px -12px rgba(139,92,246,1);background-position:100% 0}
.btn-primary:active{transform:translateY(0) scale(.99)}
.btn-ghost{
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:14px 24px;
}
.btn-ghost:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn.wide{width:100%}
.link-back{
  background:none;border:none;color:var(--muted);font-family:inherit;font-size:.85rem;
  cursor:pointer;padding:6px 0;transition:.2s;letter-spacing:.3px;
}
.link-back:hover{color:#c4b5fd}

/* ---------- sections ---------- */
.section{display:flex;flex-direction:column;gap:18px;padding:16px 0 10px;align-items:center;text-align:center}
.section.narrow{max-width:560px;margin:0 auto;width:100%}
.section.center{align-items:center}
.section .title{margin-top:2px}
.my-ais{width:100%;padding:10px 0 20px}
.sec-title{font-size:.78rem;letter-spacing:2.4px;color:var(--muted);text-transform:uppercase;margin-bottom:14px;text-align:center}

/* ---------- category cards ---------- */
.cat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  gap:15px;width:100%;max-width:880px;text-align:left;
}
.cat-card{
  background:var(--glass);border:1px solid var(--border);border-radius:20px;
  padding:22px;cursor:pointer;transition:.26s;backdrop-filter:blur(16px);
  display:flex;flex-direction:column;gap:7px;font-family:inherit;color:var(--text);
  position:relative;overflow:hidden;text-align:left;
}
.cat-card::after{
  content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(140deg,rgba(139,92,246,.16),transparent 55%);
  opacity:0;transition:.26s;
}
.cat-card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.55);box-shadow:0 24px 60px -26px rgba(139,92,246,.95)}
.cat-card:hover::after{opacity:1}
.cat-card.mini{flex-direction:row;align-items:center;gap:14px;padding:16px;text-decoration:none}
.ic{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;
  background:linear-gradient(140deg,rgba(139,92,246,.28),rgba(6,182,212,.22));
  border:1px solid rgba(255,255,255,.11);margin-bottom:4px;flex:0 0 auto;
}
.ic.big{width:60px;height:60px;font-size:1.8rem;border-radius:18px}
.cc-name{font-weight:600;font-size:1.02rem;letter-spacing:.2px}
.cc-tag{font-size:.7rem;letter-spacing:1.4px;text-transform:uppercase;color:#a78bfa;font-weight:600}
.cc-desc{font-size:.82rem;color:var(--muted);line-height:1.55;margin-top:2px}
.cc-go{font-size:.78rem;color:#67e8f9;margin-top:8px;font-weight:600}

/* ---------- form ---------- */
.form-head{display:flex;align-items:center;gap:14px;text-align:left;width:100%;margin-bottom:4px}
.panel{
  background:var(--glass);border:1px solid var(--border);border-radius:22px;
  padding:24px;backdrop-filter:blur(18px);box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
  width:100%;
}
.form{display:flex;flex-direction:column;gap:16px}
.field label{
  display:block;font-size:.7rem;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;font-weight:600;
}
.field .opt{color:#4b5563;letter-spacing:.6px;text-transform:none;font-weight:400}
input,textarea{
  width:100%;background:rgba(255,255,255,.045);border:1px solid var(--border);
  border-radius:13px;padding:13px 16px;color:#fff;font-family:inherit;font-size:.94rem;
  outline:none;transition:.2s;resize:vertical;
}
input::placeholder,textarea::placeholder{color:#4b5563}
input:focus,textarea:focus{
  border-color:rgba(139,92,246,.75);background:rgba(255,255,255,.07);
  box-shadow:0 0 0 4px rgba(139,92,246,.13);
}
.hint{font-size:.75rem;color:#4b5563;text-align:center;line-height:1.5}

/* ---------- success ---------- */
.success-ic{font-size:3rem;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.url-panel{display:flex;flex-direction:column;gap:13px;text-align:left}
.url-label{font-size:.68rem;letter-spacing:1.9px;text-transform:uppercase;color:#67e8f9;font-weight:700}
.url-row{display:flex;gap:9px}
.url-input{font-size:.8rem;color:#a5f3fc;font-family:ui-monospace,monospace}
.url-row .btn{padding:12px 18px;font-size:.85rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:150px}
.copy-ok{color:#10b981 !important;border-color:rgba(16,185,129,.5) !important}

/* ---------- chat ---------- */
.chat-page{display:flex;align-items:center;justify-content:center;padding:16px;max-width:none;height:100dvh;min-height:100dvh}
.chat-shell{
  width:min(900px,100%);height:min(90dvh,880px);
  display:flex;flex-direction:column;
  background:rgba(11,15,26,.76);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:24px;overflow:hidden;
  box-shadow:0 40px 100px -40px rgba(0,0,0,1),0 0 0 1px rgba(255,255,255,.03) inset;
}
.chat-head{
  display:flex;align-items:center;gap:12px;padding:15px 18px;
  border-bottom:1px solid var(--border);background:rgba(255,255,255,.025);
}
.back-btn{
  width:36px;height:36px;flex:0 0 auto;border-radius:11px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  font-size:1rem;transition:.2s;display:grid;place-items:center;
}
.back-btn:hover{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.5);transform:translateX(-2px)}
.avatar{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  font-weight:700;font-size:.85rem;letter-spacing:.5px;color:#fff;flex:0 0 auto;
  background:linear-gradient(140deg,#8b5cf6,#06b6d4);
  box-shadow:0 0 24px -6px rgba(139,92,246,.95);
}
.chat-id{flex:1;min-width:0}
.chat-name{font-weight:700;font-size:1rem;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:7px;font-size:.72rem;color:#9ca3af;flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 9px #10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.chat-box{
  flex:1;overflow-y:auto;padding:22px 20px;
  display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;
}
.chat-box::-webkit-scrollbar{width:6px}
.chat-box::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:99px}
.chat-box::-webkit-scrollbar-track{background:transparent}

.msg{
  max-width:78%;padding:13px 17px;border-radius:18px;
  font-size:.925rem;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;
  animation:msgIn .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes msgIn{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:none}}
.msg.user{
  align-self:flex-end;border-bottom-right-radius:5px;color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);
  box-shadow:0 10px 30px -12px rgba(139,92,246,1);
}
.msg.bot{
  align-self:flex-start;border-bottom-left-radius:5px;
  background:rgba(255,255,255,.055);border:1px solid var(--border);color:#e5e7eb;
}
.msg code{background:rgba(139,92,246,.22);padding:1px 6px;border-radius:6px;font-size:.86em}
.msg strong{color:#fff}

.typing{display:inline-flex;gap:5px;align-items:center;min-height:1.3em}
.typing span{width:7px;height:7px;border-radius:50%;background:#a78bfa;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.22;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

.input-area{
  display:flex;gap:10px;padding:14px 16px;
  border-top:1px solid var(--border);background:rgba(0,0,0,.28);
}
.input-area input{flex:1;border-radius:13px}
.send{
  width:52px;flex:0 0 auto;border:none;border-radius:13px;cursor:pointer;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;font-size:1.1rem;
  transition:.22s;box-shadow:0 10px 26px -12px rgba(139,92,246,1);
}
.send:hover{transform:translateY(-2px);box-shadow:0 14px 32px -12px rgba(139,92,246,1)}
.send:active{transform:scale(.96)}

/* ---------- media / image ---------- */
.media-page{padding-bottom:50px}
.media-main{flex:1;display:flex;flex-direction:column;gap:20px;padding:26px 0 0;align-items:center}
.media-head{text-align:center;display:flex;flex-direction:column;gap:9px;align-items:center}
.avatar-img{
  width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:1.7rem;
  background:linear-gradient(140deg,rgba(236,72,153,.35),rgba(139,92,246,.35));
  border:1px solid rgba(255,255,255,.13);box-shadow:0 0 40px -12px rgba(236,72,153,.9);
}
.search-bar{display:flex;gap:10px;width:100%;max-width:680px}
.search-bar input{flex:1}
.search-bar .btn{padding:0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px}
.chip{
  font-size:.75rem;padding:7px 14px;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.045);border:1px solid var(--border);color:var(--muted);
  transition:.2s;font-family:inherit;
}
.chip:hover{color:#c4b5fd;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.13);transform:translateY(-2px)}

.gallery{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:15px;width:100%;padding-bottom:20px;
}
.img-card{
  background:var(--glass);border:1px solid var(--border);border-radius:18px;
  overflow:hidden;animation:fadeUp .45s cubic-bezier(.2,.8,.2,1);
}
.img-holder{aspect-ratio:1;position:relative;background:rgba(255,255,255,.03);display:grid;place-items:center;overflow:hidden}
.gen-img{width:100%;height:100%;object-fit:cover;display:block;animation:msgIn .4s ease}
.shimmer{
  position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(255,255,255,.02) 20%,rgba(139,92,246,.16) 50%,rgba(255,255,255,.02) 80%);
  background-size:220% 100%;animation:shim 1.4s linear infinite;
}
@keyframes shim{from{background-position:180% 0}to{background-position:-80% 0}}
.img-err{color:#f87171;font-size:.82rem;padding:20px;text-align:center}
.img-meta{
  padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:9px;
  border-top:1px solid var(--border);
}
.img-prompt{font-size:.75rem;color:var(--muted);line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini-btn{
  font-size:.7rem;color:#67e8f9;text-decoration:none;border:1px solid rgba(6,182,212,.4);
  padding:5px 10px;border-radius:8px;white-space:nowrap;transition:.2s;flex:0 0 auto;
}
.mini-btn:hover{background:rgba(6,182,212,.16)}

/* ---------- search ---------- */
.results{display:flex;flex-direction:column;gap:14px;width:100%;max-width:780px}
.ans-head{
  display:flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:1.7px;
  text-transform:uppercase;color:#a78bfa;font-weight:700;margin-bottom:12px;
}
.ans-body{font-size:.93rem;line-height:1.7;color:#e5e7eb;white-space:pre-wrap;overflow-wrap:anywhere}
.wiki-list{display:flex;flex-direction:column;gap:13px}
.wiki-item{display:block;text-decoration:none;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.05)}
.wiki-item:last-child{border-bottom:none;padding-bottom:0}
.wiki-title{color:#7dd3fc;font-weight:600;font-size:.94rem;margin-bottom:4px}
.wiki-item:hover .wiki-title{text-decoration:underline}
.wiki-snippet{font-size:.82rem;color:var(--muted);line-height:1.6}
.ext-links{display:flex;flex-wrap:wrap;gap:8px}
.ext-links a{
  font-size:.78rem;color:#e5e7eb;text-decoration:none;padding:8px 15px;border-radius:10px;
  background:rgba(255,255,255,.045);border:1px solid var(--border);transition:.2s;
}
.ext-links a:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.55);transform:translateY(-2px)}

@media(max-width:560px){
  .title{max-width:100%}
  .chat-page{padding:0}
  .chat-shell{height:100dvh;border-radius:0;border-left:none;border-right:none}
  .msg{max-width:88%}
  .search-bar{flex-direction:column}
  .search-bar .btn{padding:15px}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .url-row{flex-direction:column}
  .made{font-size:.7rem}
}
</style>
</head>

  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
